<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#150e0b">
  <meta name="description" content="Apunta tu móvil a una tarjeta y el cráter Jezero de Marte se levanta en relieve, con el rover Perseverance siguiendo la ruta más segura.">
  <title>Mapa Seguro de Marte</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23150e0b'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e96f3f' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%2322e0ff'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/qrcode.js"></script>
</head>
<body class="pagina-portada">
  <!-- Los textos salen de js/config.js (data-t = clave del texto) -->
  <main>
    <section class="portada" id="portada">
      <!-- Curvas de nivel + ruta A -> B: las dibuja el script de abajo -->
      <svg id="plano" aria-hidden="true" focusable="false"></svg>

      <div class="portada-in">
        <div class="texto">
          <h1><span data-t="tituloA"></span> <span class="marte" data-t="tituloB"></span></h1>
          <p class="lema" data-t="subtitulo"></p>

          <div class="botones">
            <a class="boton grande primario" id="btn-ar" href="ar.html"><span class="ico ico-ar" aria-hidden="true"></span><span data-t="verAR"></span></a>
            <a class="boton grande secundario" id="btn-3d" href="viewer.html"><span class="ico ico-cubo" aria-hidden="true"></span><span data-t="ver3D"></span></a>
          </div>
          <p class="pista" data-t="pistaAR"></p>
        </div>

        <figure class="tarjeta-fig">
          <div class="tarjeta-marcas">
            <img id="img-tarjeta" src="assets/target/card.png" width="674" height="372" alt="">
          </div>
          <figcaption>
            <h2 data-t="tarjetaTitulo"></h2>
            <p data-t="tarjetaTexto"></p>
            <a id="btn-tarjeta" href="assets/target/card.png" target="_blank" rel="noopener"><span data-t="abrirTarjeta"></span><span class="ico ico-flecha" aria-hidden="true"></span></a>
          </figcaption>
        </figure>
      </div>
    </section>

    <section class="seccion" aria-labelledby="pasos-t">
      <div class="seccion-in">
        <div>
          <h2 id="pasos-t" data-t="pasosTitulo"></h2>
          <ol class="pasos">
            <li><strong data-t="paso1T"></strong><span data-t="paso1"></span></li>
            <li><strong data-t="paso2T"></strong><span data-t="paso2"></span></li>
            <li><strong data-t="paso3T"></strong><span data-t="paso3"></span></li>
          </ol>
        </div>

        <div class="qr-panel">
          <h2 data-t="qrTitulo"></h2>
          <p data-t="qrTexto"></p>
          <div id="qr"></div>
          <p id="qr-local"></p>
          <div class="enlace">
            <p data-t="pistaEnlace"></p>
            <code id="url-pagina"></code>
            <button class="boton" id="btn-copiar" type="button"><span class="ico ico-copiar" aria-hidden="true"></span><span id="txt-copiar" data-t="copiar"></span></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="pie"><p data-t="creditos"></p></footer>

  <script>
    MARTE.traducirPagina();
    document.getElementById('img-tarjeta').alt = MARTE.t('tarjetaTitulo');
    // Mantiene ?lite / ?debug al pasar a las otras páginas
    document.getElementById('btn-ar').href = MARTE.conParams('ar.html');
    document.getElementById('btn-3d').href = MARTE.conParams('viewer.html');

    /* ---------- Enlace, QR y botón de copiar ---------- */
    // Dirección de esta página (sin ? ni #) para abrirla en el móvil
    var url = window.location.href.split('?')[0].split('#')[0];
    document.getElementById('url-pagina').textContent = url;

    // QR: módulos oscuros sobre fondo claro (así lo leen todas las cámaras). qrcode.js es de Kazuhiko Arase (MIT).
    (function () {
      var destino = document.getElementById('qr');
      try {
        var qr = qrcode(0, 'M');          // 0 = tamaño automático, 'M' = corrección de errores media
        qr.addData(url);
        qr.make();
        var n = qr.getModuleCount(), margen = 4, trazo = '';   // margen = zona en blanco de 4 módulos
        for (var f = 0; f < n; f++) {
          for (var c = 0; c < n; c++) {
            if (qr.isDark(f, c)) { trazo += 'M' + (c + margen) + ' ' + (f + margen) + 'h1v1h-1z'; }
          }
        }
        var lado = n + margen * 2;
        destino.innerHTML = '<svg viewBox="0 0 ' + lado + ' ' + lado + '" shape-rendering="crispEdges" role="img" aria-label="' +
          MARTE.t('qrAlt') + '"><path d="' + trazo + '" fill="#1a0e09"/></svg>';
      } catch (e) { destino.textContent = ''; }   // si falla, queda el enlace para copiar
      // En localhost el móvil no podrá abrir el enlace: lo avisamos
      if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(window.location.hostname)) {
        document.getElementById('qr-local').textContent = MARTE.t('qrLocal');
      }
    })();

    document.getElementById('btn-copiar').addEventListener('click', function () {
      var etiqueta = document.getElementById('txt-copiar');
      function listo() {
        etiqueta.textContent = MARTE.t('copiado');
        setTimeout(function () { etiqueta.textContent = MARTE.t('copiar'); }, 2000);
      }
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(listo, function () {});
      } else {   // navegadores antiguos: seleccionamos el texto y copiamos
        var rango = document.createRange();
        rango.selectNodeContents(document.getElementById('url-pagina'));
        var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rango);
        try { document.execCommand('copy'); listo(); } catch (e) { /* el usuario puede copiar el texto seleccionado */ }
      }
    });

    /* ---------- Plano de curvas de nivel de fondo ----------
       Se inventa una "altura" para cada punto de la pantalla (un cráter con borde elevado + relieve suave)
       y se trazan líneas donde la altura vale 1, 2, 3... (algoritmo "marching squares").
       Donde las líneas se juntan hay pendiente fuerte: justo lo que mide el proyecto. */
    (function () {
      var NS = 'http://www.w3.org/2000/svg';
      var plano = document.getElementById('plano');
      var portada = document.getElementById('portada');
      var primera = true;                                   // la ruta se anima solo la primera vez
      var sinMovimiento = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function nuevo(tag, atributos, padre) {
        var e = document.createElementNS(NS, tag);
        for (var k in atributos) { e.setAttribute(k, atributos[k]); }
        (padre || plano).appendChild(e);
        return e;
      }

      function dibujar() {
        var w = portada.clientWidth, h = portada.clientHeight;
        if (!w || !h) { return; }
        plano.innerHTML = '';
        plano.setAttribute('viewBox', '0 0 ' + w + ' ' + h);

        // Ruta A -> B en la franja de abajo (fuera de la tarjeta y del texto); el cráter se centra en esa franja.
        var ancho = w >= 900;
        var y0 = h - (ancho ? 96 : 84);
        var A = ancho ? [w * 0.50, y0 + 20] : [w * 0.10, y0 + 20];
        var B = ancho ? [w * 0.93, y0 - 34] : [w * 0.90, y0 - 34];
        var cx = ancho ? w * 0.75 : w * 0.50;
        var cy = y0 - 8;
        var R = ancho ? Math.min(w * 0.27, h * 0.5) : w * 0.58;

        function altura(x, y) {
          var dx = (x - cx) / R, dy = (y - cy) / (R * 0.8);
          var d = Math.sqrt(dx * dx + dy * dy);
          var borde = Math.exp(-Math.pow((d - 1) / 0.2, 2));          // anillo elevado (borde del cráter)
          var fondo = -0.6 * Math.exp(-Math.pow(d / 0.85, 2));        // fondo hundido
          var suave = 0.5 * Math.sin(x / (R * 1.1) + 0.8) * Math.cos(y / (R * 0.9) - 0.3);   // colinas anchas
          var rugoso = 0.07 * Math.sin(x / (R * 0.33) + 2) * Math.cos(y / (R * 0.29));       // detalle
          return borde + fondo + suave + rugoso;
        }

        // Rejilla de alturas
        var paso = 10, cols = Math.ceil(w / paso) + 1, filas = Math.ceil(h / paso) + 1, malla = [];
        var minimo = 1e9, maximo = -1e9;
        for (var j = 0; j < filas; j++) {
          malla[j] = [];
          for (var i = 0; i < cols; i++) {
            var v = altura(i * paso, j * paso);
            malla[j][i] = v;
            if (v < minimo) { minimo = v; }
            if (v > maximo) { maximo = v; }
          }
        }

        // Líneas: una cada 0.07 de altura; cada 5ª es "maestra" (más marcada, como en un mapa topográfico)
        var normales = '', maestras = '';
        var nivel0 = Math.ceil(minimo / 0.07);
        for (var n = nivel0; n * 0.07 < maximo; n++) {
          var L = n * 0.07, trazo = '';
          for (var fy = 0; fy < filas - 1; fy++) {
            for (var fx = 0; fx < cols - 1; fx++) {
              var tl = malla[fy][fx], tr = malla[fy][fx + 1], br = malla[fy + 1][fx + 1], bl = malla[fy + 1][fx];
              var caso = (tl > L ? 8 : 0) + (tr > L ? 4 : 0) + (br > L ? 2 : 0) + (bl > L ? 1 : 0);
              if (caso === 0 || caso === 15) { continue; }
              var x0 = fx * paso, y0 = fy * paso;
              // Punto de corte en cada lado de la celda: arriba, derecha, abajo, izquierda
              var P = {
                T: [x0 + paso * (L - tl) / (tr - tl), y0],
                R: [x0 + paso, y0 + paso * (L - tr) / (br - tr)],
                B: [x0 + paso * (L - bl) / (br - bl), y0 + paso],
                I: [x0, y0 + paso * (L - tl) / (bl - tl)]
              };
              var lados = ({ 1: 'IB', 2: 'BR', 3: 'IR', 4: 'TR', 5: 'TI BR', 6: 'TB', 7: 'TI', 8: 'TI',
                             9: 'TB', 10: 'TR IB', 11: 'TR', 12: 'IR', 13: 'BR', 14: 'IB' })[caso].split(' ');
              for (var s = 0; s < lados.length; s++) {
                var p = P[lados[s][0]], q = P[lados[s][1]];
                trazo += 'M' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + 'L' + q[0].toFixed(1) + ' ' + q[1].toFixed(1);
              }
            }
          }
          if (n % 5 === 0) { maestras += trazo; } else { normales += trazo; }
        }
        nuevo('path', { 'class': 'curva', d: normales });
        nuevo('path', { 'class': 'curva maestra', d: maestras });

        // Curva suave en forma de S entre A y B
        var d = 'M' + A[0] + ' ' + A[1] + ' C' + (A[0] + (B[0] - A[0]) * 0.35) + ' ' + (A[1] - 70) + ' ' +
                (A[0] + (B[0] - A[0]) * 0.65) + ' ' + (B[1] + 70) + ' ' + B[0] + ' ' + B[1];
        nuevo('path', { 'class': 'ruta-halo', d: d, pathLength: 1 });
        var ruta = nuevo('path', { 'class': 'ruta-linea', d: d, pathLength: 1, id: 'ruta-trazo' });
        nuevo('circle', { 'class': 'punto', cx: A[0], cy: A[1], r: 7 });
        nuevo('circle', { 'class': 'punto', cx: B[0], cy: B[1], r: 7 });
        var etiqueta = function (texto, x, y, ancla) {
          var t = nuevo('text', { x: x, y: y, 'text-anchor': ancla });
          t.textContent = texto;
        };
        etiqueta(MARTE.t('etiquetaA'), A[0] - 6, A[1] + 28, 'start');   // A: debajo del punto
        etiqueta(MARTE.t('etiquetaB'), B[0] + 4, B[1] - 18, 'end');     // B: encima del punto

        // Rover: un punto que avanza junto a la línea al dibujarse (o ya en B si se prefiere sin movimiento)
        if (primera && !sinMovimiento) {
          portada.classList.add('dibujar');
          var g = nuevo('g', { visibility: 'hidden' });
          nuevo('set', { attributeName: 'visibility', to: 'visible', begin: '0.5s', fill: 'freeze' }, g);
          nuevo('circle', { 'class': 'rover', r: 7 }, g);
          var mov = nuevo('animateMotion', { dur: '2.6s', begin: '0.5s', fill: 'freeze', keyPoints: '0;1', keyTimes: '0;1',
                                             calcMode: 'spline', keySplines: '0.16 1 0.3 1' }, g.lastChild);
          nuevo('mpath', { href: '#ruta-trazo' }, mov);
        } else {
          portada.classList.remove('dibujar');
          nuevo('circle', { 'class': 'rover', cx: B[0], cy: B[1], r: 7 });
        }
        primera = false;
      }

      dibujar();
      // Si cambia el tamaño de la ventana, se vuelve a dibujar (sin repetir la animación)
      var espera = null, anchoAntes = portada.clientWidth, altoAntes = portada.clientHeight;
      window.addEventListener('resize', function () {
        clearTimeout(espera);
        espera = setTimeout(function () {
          // En móvil la barra del navegador dispara 'resize' al hacer scroll: solo redibujamos si cambia el tamaño de verdad
          if (Math.abs(portada.clientWidth - anchoAntes) > 1 || Math.abs(portada.clientHeight - altoAntes) > 80) {
            anchoAntes = portada.clientWidth; altoAntes = portada.clientHeight; dibujar();
          }
        }, 200);
      });
    })();
  </script>
</body>
</html>
